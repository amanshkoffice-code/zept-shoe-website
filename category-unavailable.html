<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEPT | Category Update</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  background: radial-gradient(circle at top, #12001f, #000);
  color: #fff;
  font-family: 'Orbitron', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Card */
.unavailable-card {
  max-width: 520px;
  width: 90%;
  background: rgba(15, 0, 30, 0.85);
  border-radius: 20px;
  padding: 50px 40px;
  text-align: center;
  box-shadow:
    0 0 40px rgba(127, 92, 255, 0.35),
    inset 0 0 25px rgba(127, 92, 255, 0.15);
  animation: fadeUp 1.1s ease;
}

/* Icon */
.unavailable-icon {
  font-size: 64px;
  color: #9b6cff;
  margin-bottom: 20px;
  animation: pulse 2.5s infinite;
}

/* Heading */
.unavailable-card h1 {
  font-size: 1.6rem;
  margin-bottom: 12px;
}

/* Text */
.unavailable-card p {
  font-size: 0.95rem;
  opacity: 0.75;
  margin-bottom: 30px;
}

/* Button */
.back-btn {
  padding: 12px 30px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #7f5cff, #c77dff);
  color: #fff;
  font-size: 0.85rem;
  letter-spacing: 1px;
  transition: 0.35s ease;
  box-shadow: 0 0 18px rgba(127, 92, 255, 0.6);
}

.back-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 35px rgba(127, 92, 255, 1);
}

/* Animations */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.15); opacity: 1; }
}
</style>
</head>

<body>

<div class="unavailable-card">
  <div class="unavailable-icon">
    <i class="bi bi-box-seam"></i>
  </div>

  <h1>Stock Unavailable</h1>
  <p>
    This category is currently under update.<br>
    New collections are arriving soon.<br>
    Please check back later.
  </p>

  <button class="back-btn" onclick="history.back()">
    <i class="bi bi-arrow-left"></i> Go Back
  </button>
</div>

</body>
</html>
